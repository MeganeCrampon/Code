<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur de Compatibilité Amoureuse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Calculateur de compatibilité amoureuse</h1>
    <form id="compatibilityForm">
        <p>Saisis les prénoms dont tu souhaite calculer la compatibilité amoureuse :</p> 
        
        <label for="name1">Prénom 1 :</label>
        <input type="text" id="name1" name="name1" placeholder="Prénom 1" required>

        <label for="name2">Prénom 2 :</label>
        <input type="text" id="name2" name="name2" placeholder="Prénom 2" required>

        <button type="submit">Calculer</button>
    </form>

    <div id="result"></div>

    <script src="script.js"></script>
</body>
</html>
