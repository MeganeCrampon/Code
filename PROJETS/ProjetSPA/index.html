<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma petite SPA</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/converter.css">
    <link rel="stylesheet" href="css/compatibility.css">
    <link rel="stylesheet" href="css/plushie.css">
</head>
<body>

    <div class="language-selector">
        <select id="languageSelector">
            <option value="fr">🇫🇷 Français</option>
            <option value="en">🇺🇸 English</option>
        </select>
    </div>

    <nav id="mainNav">
        <button class="nav-btn" data-target="plushie" data-i18n="plushie.button">Estimateur de prix de peluches</button>
        <button class="nav-btn" data-target="converter" data-i18n="converter.button">Convertisseur de température</button>
        <button class="nav-btn" data-target="compatibility" data-i18n="compatibility.button">Compatibilité amoureuse</button>
    </nav>

    <section id="plushie" class="app-section">
        <h1 data-i18n="plushie.title">Estimons de prix de ta peluche !</h1>
            <div class="currency-selector">
                <label for="currency" data-i18n="plushie.currency">Devise</label>
                <select id="currency">
                    <option value="EUR">€ EUR</option>
                    <option value="USD">$ USD</option>
                    <option value="GBP">£ GBP</option>
                </select>
            </div>

            <div class="content">

                <form id="plushieForm">

                    <label for="name" data-i18n="plushie.name">Nom</label>
                    <input type="text" id="name" name="name" placeholder="Nom" data-i18n-placeholder="plushie.name.placeholder" required>
                    <label for="hours" data-i18n="plushie.hours">Temps (heures)</label>
                    <input type="number" id="hours" name="hours" placeholder="Heures" data-i18n-placeholder="plushie.hours.placeholder">
                    <label for="minutes" data-i18n="plushie.minutes">Temps (minutes)</label>
                    <input type="number" id="minutes" name="minutes" placeholder="Minutes" max="59" data-i18n-placeholder="plushie.minutes.placeholder">
                    <label for="materialPrice" data-i18n="plushie.materialPrice">Prix du matériel</label>
                    <input type="number" id="materialPrice" name="materialPrice" placeholder="Prix de matériel" data-i18n-placeholder="plushie.materialPrice.placeholder">
                    <label for="patternPrice" data-i18n="plushie.patternPrice">Prix du pattern</label>
                    <input type="number" id="patternPrice" name="patternPrice"  placeholder="Prix du modèle" data-i18n-placeholder="plushie.patternPrice.placeholder">

                    <button type="submit" data-i18n="plushie.estimate">Estimer</button>

                </form>

                <div id="priceResult" data-i18n-empty="plushie.emptyResult"></div>
            
            </div>
    </section>
    
    <section id="converter" class="app-section" hidden>
        <h1 data-i18n="converter.title">Convertisseur de Température</h1>
        <form id="converterForm">
            <label for="inputTemperature" data-i18n="converter.temperature">Température :</label>
            <input type="number" id="inputTemperature" name="temperature" required data-i18n-placeholder="converter.temperature.placeholder">
            <select id="unit" name="unit">
                <option value="C-to-F" data-i18n="converter.cToF">Celsius -> Fahrenheit</option>
                <option value="F-to-C" data-i18n="converter.fToC">Fahrenheit -> Celsius</option>
            </select>
            <button type="submit" data-i18n="converter.convert">Convertir</button>
        </form>

        <div id="converterResult"></div>
    </section>

    <section id="compatibility" class="app-section" hidden>
        <h1 data-i18n="compatibility.title">Calculateur de compatibilité amoureuse</h1>
        <form id="compatibilityForm">
            <p data-i18n="compatibility.description">Saisis les prénoms dont tu souhaite calculer la compatibilité amoureuse :</p> 
            
            <label for="name1" data-i18n="compatibility.name1">Prénom 1 :</label>
            <input type="text" id="name1" name="name1" placeholder="Prénom 1" data-i18n-placeholder="compatibility.name1.placeholder" required>

            <label for="name2" data-i18n="compatibility.name2">Prénom 2 :</label>
            <input type="text" id="name2" name="name2" placeholder="Prénom 2" data-i18n-placeholder="compatibility.name2.placeholder" required>

            <button type="submit" data-i18n="compatibility.calculate">Calculer</button>
        </form>

        <div id="compatibilityResult"></div>
    </section>


    <script src="js/translations.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/converter.js"></script>
    <script src="js/compatibility.js"></script>
    <script src="js/plushie.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
